name: Vérification du site Piloz

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Vérifier les liens et les secrets
        run: |
          test "$(tr -d '\r\n' < CNAME)" = "piloz.fr"
          ! git ls-files | grep -E '(^|/)\.env($|\.)'
          ! grep -RInE --exclude-dir=.git 'sk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|service_role.*eyJ' .
          grep -nE 'billing.*annual|billing.*monthly|checkout\.html' assets/js/config.js assets/js/pricing.js
          node scripts/verify-seo.mjs
          node tests/no-stock-public-copy-static.cjs
      - name: Tester le sélecteur tarifaire
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/piloz-site-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          output=$(google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --user-data-dir="$RUNNER_TEMP/chrome-pricing" --dump-dom "http://127.0.0.1:8765/tests/pricing-links.html")
          echo "$output" | grep 'data-status="passed"'
